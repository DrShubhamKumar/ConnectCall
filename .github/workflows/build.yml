name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # यहाँ v4 की जगह v5 कर दिया है ताकि वार्निंग हट जाए
        with:
          java-version: '17'
          distribution: 'temurin'

      # यहाँ हम चेक कर रहे हैं कि फाइल कहाँ है, ताकि एरर न आए
      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f ./ConnectCall/gradlew ]; then
            cd ConnectCall
            chmod +x gradlew
          else
            echo "Gradlew file not found!"
            exit 1
          fi

      # सही फोल्डर में जाकर APK बिल्ड करना
      - name: Build with Gradle
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            cd ConnectCall
            ./gradlew assembleDebug
          fi

      # बनी हुई APK को खोजना और अपलोड करना
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConnectCall-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk


name: Debug Repo Structure

on:
  workflow_dispatch:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: ls -R
