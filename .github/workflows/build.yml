name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 21 सेटअप करना
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. गायब gradlew फाइल को खुद से जनरेट करना
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # 3. फाइल को रन करने की परमिशन देना
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. बिना Keystore एरर के APK फाइल कंपाइल/बिल्ड करना
      - name: Build with Gradle
        run: ./gradlew assembleDebug -x validateSigningDebug -x :app:validateSigningDebug

      # 5. बनी हुई APK को डाउनलोड के लिए सेव करना
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConnectCall-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
